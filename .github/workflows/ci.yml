name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install
        run: pip install -r requirements-api.txt pytest httpx
      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t image-compliance .
      - name: Start container
        run: docker run -d --name api -p 8000:8000 image-compliance
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs api; exit 1
      - name: Smoke test with the real model
        run: |
          pip install pillow
          python -c "from PIL import Image; Image.new('RGB', (300, 300), (230, 60, 60)).save('red.png')"
          curl -sf -F "file=@red.png" http://127.0.0.1:8000/predict | tee out.json
          python -c "import json; r = json.load(open('out.json')); assert r['nwb']['flag'] is True, r"
